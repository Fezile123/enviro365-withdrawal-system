<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviro365 Investments — Withdrawals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__row">
    <span class="wordmark">Enviro365 Investments</span>
    <label class="investor-picker">
      Viewing
      <select id="investorSelect"></select>
    </label>
  </div>
</header>

<main class="wrap">

  <!-- Portfolio dashboard -->
  <section class="hero" aria-labelledby="investorName">
    <p class="hero__name" id="investorName">&nbsp;</p>
    <p class="hero__label">Total portfolio value</p>
    <p class="hero__figure" id="totalBalance">R 0.00</p>

    <div class="product-grid" id="productGrid"></div>
  </section>

  <!-- Withdrawal form -->
  <section class="panel" aria-labelledby="withdrawTitle">
    <h2 id="withdrawTitle">Request a withdrawal</h2>

    <form id="withdrawalForm" novalidate>
      <div class="field">
        <label for="productSelect">Product</label>
        <select id="productSelect" name="productId" required></select>
        <p class="field__error" id="productError" hidden></p>
      </div>

      <div class="field">
        <label for="amountInput">Amount (R)</label>
        <input type="number" id="amountInput" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
        <p class="field__error" id="amountError" hidden></p>
      </div>

      <button type="submit" class="button button--primary">Submit withdrawal</button>
    </form>

    <div id="formFeedback" class="feedback" hidden></div>
  </section>

  <!-- Withdrawal history -->
  <section class="panel" aria-labelledby="historyTitle">
    <div class="panel__header">
      <h2 id="historyTitle">Withdrawal history</h2>

      <div class="export-controls">
        <label>
          Status
          <select id="exportStatus">
            <option value="">All</option>
            <option value="APPROVED">Approved</option>
            <option value="PENDING">Pending</option>
            <option value="REJECTED">Rejected</option>
          </select>
        </label>
        <button type="button" id="exportButton" class="button button--secondary">Download CSV</button>
      </div>
    </div>

    <table class="history-table">
      <thead>
        <tr>
          <th scope="col">Notice</th>
          <th scope="col">Product</th>
          <th scope="col">Amount</th>
          <th scope="col">Balance after</th>
          <th scope="col">Status</th>
          <th scope="col">Date</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr class="empty-row"><td colspan="6">No withdrawals yet.</td></tr>
      </tbody>
    </table>
  </section>

</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
